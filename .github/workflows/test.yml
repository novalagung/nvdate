name: Test

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-macos:
    name: Test macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

  test-linux:
    name: Test Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Run tests
        run: swift test

  coverage:
    name: Coverage
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests with coverage
        run: swift test --enable-code-coverage

      - name: Generate coverage badge endpoint
        run: |
          profile="$(find .build -path '*/debug/*/default.profdata' -print -quit)"
          coverage="$(
            xcrun llvm-cov report \
            .build/debug/NVDatePackageTests.xctest/Contents/MacOS/NVDatePackageTests \
            -instr-profile "$profile" \
            | awk '/NVDate.swift/ { print $10 }'
          )"

          if [ -z "$coverage" ]; then
            echo "Unable to determine coverage for NVDate.swift"
            exit 1
          fi

          awk -v coverage="$coverage" '
            BEGIN {
              value = coverage + 0
              color = value >= 90 ? "brightgreen" : value >= 80 ? "green" : value >= 70 ? "yellowgreen" : value >= 60 ? "yellow" : value >= 50 ? "orange" : "red"
              printf "{\n  \"schemaVersion\": 1,\n  \"label\": \"coverage\",\n  \"message\": \"%s\",\n  \"color\": \"%s\"\n}\n", coverage, color
            }
          ' > coverage.json

      - name: Commit coverage badge endpoint
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- coverage.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -m "Update coverage badge [skip ci]"
          git push
